apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-worker
  labels:
    app: verification-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verification-worker
  template:
    metadata:
      labels:
        app: verification-worker
    spec:
      containers:
        - name: verification-worker
          image: kyc/verification-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: kyc-platform-config
            - secretRef:
                name: kyc-platform-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
