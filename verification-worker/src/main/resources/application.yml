server:
  port: 8082

spring:
  application:
    name: verification-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kyc_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# AWS / LocalStack configuration
cloud:
  aws:
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}

app:
  sqs:
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/kyc-verification-queue}
    max-messages: 10
    wait-time-seconds: 20      # Long-polling
    visibility-timeout: 30
  sns:
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:kyc-events-topic}
  verification:
    min-file-size-bytes: 51200      # 50 KB minimum
    max-file-size-bytes: 15728640   # 15 MB maximum
    blacklisted-names:
      - "FRAUD_TEST_USER"
      - "BLACKLISTED_APPLICANT"
